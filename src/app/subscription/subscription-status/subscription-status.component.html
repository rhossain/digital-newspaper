<ng-container *ngIf="isPublisherPackage">

  <!-- Logged in: show username, click opens subscription wall -->
  <button type="button" class="sub-badge sub-badge--user" *ngIf="isLoggedIn" (click)="openPaywall.emit()">
    <svg class="sub-badge__icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span class="sub-badge__label">{{ userName }}</span>
  </button>

  <!-- Not logged in: show login button, click opens subscription wall -->
  <button type="button" class="sub-badge sub-badge--login" *ngIf="!isLoggedIn" (click)="openPaywall.emit()">
    <svg class="sub-badge__icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
      <polyline points="10 17 15 12 10 7"></polyline>
      <line x1="15" y1="12" x2="3" y2="12"></line>
    </svg>
    <span class="sub-badge__label">{{ 'subscription.status.login' | translate }}</span>
  </button>

</ng-container>
