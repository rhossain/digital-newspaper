<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Digital Newspaper</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1976d2">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Default Open Graph meta tags (overridden dynamically by Angular) -->
  <meta property="og:site_name" content="Digital Newspaper">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Digital Newspaper">
  <meta property="og:description" content="দৈনিক সংগ্রাম ই-পেপার। সর্বশেষ বাংলা খবর, ইসলামী সংবাদ ও ফিচার, আন্তর্জাতিক সংবাদ, ব্যাবসা-বাণিজ্যের খবর, বিনোদন, খেলাধুলার বাংলা সংবাদ পড়তে ভিজিট করুন।">
  <meta property="og:url" content="https://diginews.rshossain.me/">
  <!-- Last-resort fallback image only: browsers get per-route tags from Angular,
       social crawlers get per-article tags from the WordPress /social endpoint.
       Points at the plugin's branded 1200x630 social image rather than the
       281x90 logo (which is below WhatsApp's 300px minimum and was being falsely
       declared as 1200x630). -->
  <meta property="og:image" content="https://diginews.rshossain.me/wp/wp-json/digital-newspaper/v1/social-thumb?homepage=1">
  <meta property="og:image:secure_url" content="https://diginews.rshossain.me/wp/wp-json/digital-newspaper/v1/social-thumb?homepage=1">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Digital Newspaper">

  <!-- Default Twitter Card meta tags (overridden dynamically by Angular) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Digital Newspaper">
  <meta name="twitter:description" content="দৈনিক সংগ্রাম ই-পেপার। সর্বশেষ বাংলা খবর, ইসলামী সংবাদ ও ফিচার, আন্তর্জাতিক সংবাদ, ব্যাবসা-বাণিজ্যের খবর, বিনোদন, খেলাধুলার বাংলা সংবাদ পড়তে ভিজিট করুন।">
  <meta name="twitter:image" content="https://diginews.rshossain.me/wp/wp-json/digital-newspaper/v1/social-thumb?homepage=1">

  <!-- Preload the three Google Sans Variable woff2 subsets used by this site.
       Without preload the browser discovers these files only after downloading
       and parsing styles.css, causing FOUT (flash of unstyled text).
       crossorigin is required for font preloads even on same-origin. -->
  <link rel="preload" href="/assets/fonts/google-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/google-sans-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/google-sans-bengali-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Google Sans is self-hosted via @fontsource-variable/google-sans (imported in styles.css).
       No external fonts.googleapis.com request needed. -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans Variable', sans-serif;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #f5f5f5;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #app-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-splash .splash-logo {
      width: auto;
      height: 64px;
      object-fit: contain;
    }

    #app-splash .splash-text {
      font-size: 18px;
      font-weight: 600;
      color: #000000;
      letter-spacing: 0.5px;
    }

    #app-splash .splash-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e3f2fd;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <img class="splash-logo" src="assets/logo.png" alt="ইপেপার - দৈনিক সংগ্রাম"
         onerror="this.style.display='none';document.getElementById('splash-fallback-text').style.display='block'" />
    <span id="splash-fallback-text" class="splash-text" style="display:none">Loading</span>
    <div class="splash-spinner"></div>
  </div>
  <!--
    Publish-time inlined bootstrap state. Empty by default and completely inert
    (type="application/json" is not executed). When the WordPress plugin's
    "inline index" option is enabled it rewrites the contents of this exact tag
    with initial-state.json on every publish, so the first paint needs ZERO API
    calls. BootstrapStateService reads it by id; if it stays empty the app boots
    via the normal network path, unchanged.
  -->
  <script id="dn-initial-state" type="application/json"></script>
  <app-root></app-root>
</body>
</html>
