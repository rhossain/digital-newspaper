name: Deploy to Hostinger

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href /

      - name: Create .htaccess for Angular routing
        run: |
          cat > dist/digital-newspaper/browser/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Publish build to release branch
        run: |
          git fetch origin
          # Create release branch from scratch (orphan = no history clutter)
          git checkout --orphan release
          git rm -rf --cached .
          # Copy built files into the workspace root
          cp -r dist/digital-newspaper/browser/. .
          # Stage only the built files (ignore source/node_modules)
          git add --force \
            index.html \
            .htaccess \
            main*.js \
            polyfills*.js \
            styles*.css \
            chunk-*.js \
            assets/ \
            media/ \
            favicon.ico \
            3rdpartylicenses.txt 2>/dev/null || true
          git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin release --force

      - name: Setup SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger via SSH
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='*.ts' \
            --exclude='node_modules' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            dist/digital-newspaper/browser/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/
