name: Deploy to Hostinger

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href /

      - name: Create .htaccess for Angular routing
        run: |
          cat > dist/digital-newspaper/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Publish build to release branch
        run: |
          git fetch origin
          # Work in a separate temp directory to avoid conflicts
          DEPLOY_DIR=$(mktemp -d)
          cp -r dist/digital-newspaper/. "$DEPLOY_DIR/"
          
          # Switch to orphan release branch (clean slate)
          git checkout --orphan release
          git rm -rf . --quiet
          
          # Copy built files back into workspace
          cp -r "$DEPLOY_DIR"/. .
          rm -rf "$DEPLOY_DIR"
          
          # Commit and push everything in the workspace (only build files exist now)
          git add -A
          git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin release --force

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Fallback: disable strict host checking if keyscan failed
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Deploy to Hostinger via SSH
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='*.ts' \
            --exclude='node_modules' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            dist/digital-newspaper/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/
